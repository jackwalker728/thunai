<header class="top" id="top">
 <div class="wrap">
  <a class="brand" href="#home"><span class="logo"><svg width="24" height="24" style="color:#fff"><use href="#i-kolam"/></svg></span><span><span data-t="app.name">Thunai</span><small data-t="app.tagline">Your companion</small></span></a>
  <nav class="topnav" id="topnav"></nav>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="Language"><button id="lEn" aria-pressed="true">EN</button><button id="lTa" aria-pressed="false">தமிழ்</button></div>
  <button class="iconbtn" id="themeBtn" aria-label="Dark mode"></button>
  <a class="iconbtn" href="#settings" aria-label="Settings"><svg width="20" height="20"><use href="#i-settings"/></svg></a>
 </div>
</header>

<div class="offline" id="offline" role="status" hidden></div>

<!-- HOME -->
<main id="v-home" class="view on"><div class="wrap">
 <section class="hero">
  <svg class="kolam" viewBox="0 0 40 40" style="color:#fff"><use href="#i-kolam"/></svg>
  <div class="greet" id="greet"></div>
  <h1 data-t="hero.title">One companion for every age</h1>
  <p data-t="hero.sub"></p>
  <div class="herobtns"><a class="talkbtn" href="#ask"><span class="mi"><svg width="22" height="22"><use href="#i-ask"/></svg></span><span data-t="ask.hero"></span></a><button class="chip-ai" id="aiChip"><i></i><span id="aiChipTxt"></span></button></div>
 </section>
 <div id="elderHome" class="elder-grid" hidden></div>
 <a class="sosbar" href="#sos" id="sosBar"><span class="sosdot">SOS</span><span><b data-t="sos.bar"></b><small data-t="sos.barSub"></small></span></a>
 <div id="rainHome"></div>
 <div id="normalHome">
 <nav class="quick" id="quick"></nav>
 <div class="notice" id="aiNotice" hidden><svg width="22" height="22" style="color:var(--warn);flex:none"><use href="#i-spark"/></svg><div style="flex:1"><span data-t="ai.offLong"></span></div><a class="btn small" href="#settings" style="--c:var(--accent)" data-t="ai.setup">Set up AI</a></div>
 <div class="section-title"><h2 data-t="helpers.title">Your helpers</h2></div>
 <div class="tiles" id="tiles"></div>
 </div>
 <div class="section-title"><h2 data-t="em.title">In an emergency</h2></div>
 <div class="emerg">
  <a href="tel:112" data-ext><span><svg width="18" height="18"><use href="#i-phone"/></svg></span><span data-t="em.112" style="width:auto;height:auto;background:none;color:inherit">Emergency 112</span></a>
  <a href="tel:1930" data-ext><span><svg width="18" height="18"><use href="#i-scam"/></svg></span><span data-t="em.1930" style="width:auto;height:auto;background:none;color:inherit">Cyber fraud 1930</span></a>
 </div>
 <p class="foot" data-t="st.aboutTxt"></p>
</div></main>

<!-- FLOOD -->
<main id="v-flood" class="view" style="--c:var(--c-flood)"><div class="narrow">
 <section class="mhead"><div class="row1"><button class="back" aria-label="Back"><svg width="22" height="22"><use href="#i-back"/></svg></button><h2 data-t="m.flood.t"></h2></div><p data-t="m.flood.long"></p></section>
 <div class="stack">
  <div id="rainFlood"></div>
  <div class="card">
   <h3 data-t="fl.route"></h3>
   <div class="ptrow"><span class="dot" style="background:#10b981"></span><div class="field"><input class="in" id="fromIn" autocomplete="off" data-tp="fl.searchPh"><div class="suggest" id="fromSug" hidden></div></div></div>
   <div class="mini"><button class="btn soft small" id="fromLoc"><svg width="16" height="16"><use href="#i-locate"/></svg><span data-t="fl.myloc"></span></button><button class="btn soft small" id="fromTap"><svg width="16" height="16"><use href="#i-pin"/></svg><span data-t="fl.tapmap"></span></button></div>
   <div class="ptrow" style="margin-top:12px"><span class="dot" style="background:#e11d48"></span><div class="field"><input class="in" id="toIn" autocomplete="off" data-tp="fl.searchPh"><div class="suggest" id="toSug" hidden></div></div></div>
   <div class="mini"><button class="btn soft small" id="toLoc"><svg width="16" height="16"><use href="#i-locate"/></svg><span data-t="fl.myloc"></span></button><button class="btn soft small" id="toTap"><svg width="16" height="16"><use href="#i-pin"/></svg><span data-t="fl.tapmap"></span></button></div>
   <label class="l" data-t="fl.by"></label>
   <div class="pills" id="vehPills"></div>
  </div>
  <div class="mapwrap">
   <div class="maphint" id="mapHint" hidden></div>
   <div class="map" id="fmap"></div>
   <div class="routebar"><div style="flex:1"><div class="st" id="routeSt">—</div><div class="meta" id="routeMeta"></div></div><button class="btn soft small" id="demoBtn" data-t="fl.demo"></button></div>
  </div>
  <div class="legend"><span><i style="background:#38bdf8"></i><span data-t="legend.lt15"></span></span><span><i style="background:#2563eb"></i><span data-t="legend.15to30"></span></span><span><i style="background:#e11d48"></i><span data-t="legend.gt30"></span></span><span><i style="background:#f59e0b"></i><span data-t="legend.route"></span></span></div>
  <div class="card">
   <h3 data-t="fl.report"></h3>
   <label class="l" data-t="fl.where"></label>
   <div class="mini" style="margin-top:0"><button class="btn soft small" id="repLoc"><svg width="16" height="16"><use href="#i-locate"/></svg><span data-t="fl.here"></span></button><button class="btn soft small" id="repCenter"><span data-t="fl.center"></span></button><button class="btn soft small" id="repTap"><svg width="16" height="16"><use href="#i-pin"/></svg><span data-t="fl.tapmap"></span></button></div>
   <div class="hint" id="repWhere"></div>
   <label class="l" data-t="fl.photo"></label>
   <label class="pick" data-pick="fImg"><input type="file" id="fImg" accept="image/*"><span class="thumb"><svg width="26" height="26"><use href="#i-camera"/></svg></span><span data-t="c.photo"></span></label>
   <label class="l" data-t="fl.desc"></label>
   <div class="composer" style="margin-top:0"><input class="in" id="fDesc" data-tp="fl.descPh"><button class="round mic" data-mic="fDesc" aria-label="Speak" hidden><svg width="20" height="20"><use href="#i-mic"/></svg></button></div>
   <button class="btn block" id="fGo" style="margin-top:14px"><svg width="18" height="18"><use href="#i-spark"/></svg><span data-t="fl.go"></span></button>
   <div class="err" id="fErr"></div>
  </div>
  <div class="out" id="fOut"></div>
  <div class="card"><h3 data-t="fl.reports"></h3><p class="hint live" id="liveSt" style="margin:-4px 0 6px"></p><div id="repList"></div><p class="hint" data-t="fl.localNote"></p></div>
 </div>
</div></main>

<!-- SCAM -->
<main id="v-scam" class="view" style="--c:var(--c-scam)"><div class="narrow">
 <section class="mhead"><div class="row1"><button class="back" aria-label="Back"><svg width="22" height="22"><use href="#i-back"/></svg></button><h2 data-t="m.scam.t"></h2></div><p data-t="m.scam.long"></p></section>
 <div class="stack">
  <div class="card">
   <label class="l" style="margin-top:0" data-t="sc.msg"></label>
   <textarea class="in" id="sTxt" data-tp="sc.ph"></textarea>
   <div class="mini"><button class="btn soft small" data-mic="sTxt" hidden><svg width="16" height="16"><use href="#i-mic"/></svg><span data-t="c.mic"></span></button></div>
   <label class="l" data-t="sc.shot"></label>
   <label class="pick"><input type="file" id="sImg" accept="image/*"><span class="thumb"><svg width="26" height="26"><use href="#i-camera"/></svg></span><span data-t="c.photo"></span></label>
   <label class="l" data-t="sc.try"></label>
   <div class="pills" id="sSamples"></div>
   <button class="btn block" id="sGo" style="margin-top:16px"><svg width="18" height="18"><use href="#i-scam"/></svg><span data-t="sc.go"></span></button>
   <div class="err" id="sErr"></div>
  </div>
  <div class="out stack" id="sOut"></div>
  <div class="card"><h3 data-t="sc.lost"></h3><p data-t="sc.lostTxt"></p><div class="btns"><a class="btn" href="tel:1930" data-ext><svg width="18" height="18"><use href="#i-phone"/></svg><span data-t="sc.call"></span></a><a class="btn soft" href="https://cybercrime.gov.in" data-ext data-t="sc.portal"></a></div></div>
 </div>
</div></main>

<!-- MEDICINE -->
<main id="v-med" class="view" style="--c:var(--c-med)"><div class="narrow">
 <section class="mhead"><div class="row1"><button class="back" aria-label="Back"><svg width="22" height="22"><use href="#i-back"/></svg></button><h2 data-t="m.med.t"></h2></div><p data-t="m.med.long"></p></section>
 <div class="stack">
  <div class="card">
   <label class="pick"><input type="file" id="mImg" accept="image/*"><span class="thumb"><svg width="26" height="26"><use href="#i-camera"/></svg></span><span data-t="md.photo"></span></label>
   <label class="l" data-t="md.name"></label>
   <div class="composer" style="margin-top:0"><input class="in" id="mName" data-tp="md.namePh"><button class="round mic" data-mic="mName" aria-label="Speak" hidden><svg width="20" height="20"><use href="#i-mic"/></svg></button></div>
   <button class="btn block" id="mGo" style="margin-top:14px"><svg width="18" height="18"><use href="#i-spark"/></svg><span data-t="md.go"></span></button>
   <div class="err" id="mErr"></div>
  </div>
  <div class="out" id="mOut"></div>
  <div class="card"><h3 data-t="md.today"></h3><div id="mToday"></div><div class="btns"><button class="btn soft" id="mFamily"><svg width="18" height="18"><use href="#i-share"/></svg><span data-t="md.tellFamily"></span></button></div></div>
  <div class="card">
   <h3 data-t="md.rx"></h3><p class="sub" data-t="md.rxSub"></p>
   <label class="pick"><input type="file" id="rxImg" accept="image/*"><span class="thumb"><svg width="26" height="26"><use href="#i-camera"/></svg></span><span data-t="md.rxPhoto"></span></label>
   <button class="btn block" id="rxGo" style="margin-top:14px"><svg width="18" height="18"><use href="#i-spark"/></svg><span data-t="md.rxGo"></span></button>
   <div class="err" id="rxErr"></div>
   <div class="out" id="rxOut"></div>
  </div>
  <div class="card"><h3 data-t="md.box"></h3><p class="sub" data-t="md.boxSub"></p><div id="mBox"></div></div>
  <p class="hint" data-t="md.note"></p>
 </div>
</div></main>

<!-- SCHEMES -->
<main id="v-sch" class="view" style="--c:var(--c-sch)"><div class="narrow">
 <section class="mhead"><div class="row1"><button class="back" aria-label="Back"><svg width="22" height="22"><use href="#i-back"/></svg></button><h2 data-t="m.sch.t"></h2></div><p data-t="m.sch.long"></p></section>
 <div class="stack">
  <div class="card">
   <div class="chat" id="chat" aria-live="polite"></div>
   <form class="composer" id="chatForm"><input class="in" id="chatIn" autocomplete="off" data-tp="ch.ph"><button type="button" class="round mic" data-mic="chatIn" data-autosend="1" aria-label="Speak" hidden><svg width="20" height="20"><use href="#i-mic"/></svg></button><button class="round go" id="chatSend" aria-label="Send"><svg width="20" height="20"><use href="#i-send"/></svg></button></form>
   <div class="pills" style="margin-top:12px" id="chatEx"></div>
   <div class="err" id="cErr"></div>
  </div>
  <div class="out" id="cOut"></div>
  <p class="hint" data-t="ch.note"></p>
 </div>
</div></main>

<!-- ENERGY -->
<main id="v-energy" class="view" style="--c:var(--c-energy)"><div class="narrow">
 <section class="mhead"><div class="row1"><button class="back" aria-label="Back"><svg width="22" height="22"><use href="#i-back"/></svg></button><h2 data-t="m.energy.t"></h2></div><p data-t="m.energy.long"></p></section>
